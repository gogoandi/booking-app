<div class="form-field">

    <label [for]="formField().name">
        {{ formField().label }}
    </label>

    <div class="input-wrapper">

        <input [id]="formField().name" [name]="formField().name"
            [type]="formField().type === 'password' && isPasswordVisible ? 'text' : formField().type"
            [formControl]="control()" [attr.min]="formField().min ?? null" />

        @if (formField().type === 'password') {
        <button type="button" class="password-toggle" (click)="togglePasswordVisibility()"
            [attr.aria-label]="isPasswordVisible ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="isPasswordVisible">
            @if (isPasswordVisible) {
            <!-- Eye off: password is visible -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c7 0 10 7 10 7a13.8 13.8 0 0 1-4.1 5.1" />
                <path d="M6.6 6.6A13.7 13.7 0 0 0 2 12s3 7 10 7a10.7 10.7 0 0 0 4.2-.8" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                <path d="M3 3l18 18" />
            </svg>
            } @else {
            <!-- Eye: password is hidden -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            }
        </button>
        }

    </div>

</div>
